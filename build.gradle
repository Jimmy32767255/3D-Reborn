plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// ModMenu（可选运行时依赖，仅用于在「模组」菜单中提供配置入口）
	maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/releases/"
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"rebof3d" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	// 客户端游戏内测试（Fabric Client Game Test API）：
	//   ./gradlew runClientGameTest
	// 会真实启动客户端、新建单人存档、启用 3D 效果并连续推进若干帧，
	// 用于验证仅在世界渲染期才会触发的双遍 + 合成路径（历史上这里曾因 UBO 标志位崩溃）。
	fabricApi {
		configureTests {
			createSourceSet = true
			modId = "rebof3d-gametest"
			eula = true
			username = "Player0"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// ModMenu：可选依赖，仅用于在「模组」菜单中提供配置入口。
	// 该 Loom（split source sets）不提供 modImplementation，且 ModMenu 21.0.0 已按官方映射
	// （named）发布，与本项目命名空间一致，故直接用 client 源集的编译期/运行期配置：
	//   clientCompileOnly —— 让 compat.ModMenuIntegration 编译通过；
	//   clientRuntimeOnly —— 仅开发环境可用，runClient 时能看到模组菜单入口。
	// 不打包进产物 jar，fabric.mod.json 也未列入 depends —— 对最终用户「装了才生效」。
	clientCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	clientRuntimeOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
	def version = project.mod_version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {
	}
}
